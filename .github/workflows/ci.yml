name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e './packages/chatsandbox[server,dev]'
      - run: python -m pip install -e ".[web,dev,docs]"
      - run: python -m pytest -q
      - run: python -m chattask.cli --version
      - run: python -m chattask.cli --tree
      - run: python -m chattask.cli --tree-brief
      - run: chatsandbox --tree
      - run: chatsandbox --tree-brief
      - name: Build shared Sandbox package
        run: |
          python -m build packages/chatsandbox --outdir "${RUNNER_TEMP}/chatsandbox-dist"
          python -m twine check "${RUNNER_TEMP}"/chatsandbox-dist/*
      - run: python -m build
      - run: mkdocs build --strict
