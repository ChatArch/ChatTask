name: Publish ChatSandbox

on:
  push:
    tags:
      - "chatsandbox-v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify package and tag
        id: meta
        run: |
          python - <<'PY'
          import ast
          import os
          from pathlib import Path
          import tomllib

          project = tomllib.loads(Path("packages/chatsandbox/pyproject.toml").read_text())["project"]
          assert project["name"] == "ChatSandbox"
          version = project["version"]
          module = ast.parse(Path("packages/chatsandbox/src/chatsandbox/__init__.py").read_text())
          exported = next(ast.literal_eval(stmt.value) for stmt in module.body
              if isinstance(stmt, ast.Assign) and any(isinstance(target, ast.Name) and
                  target.id == "__version__" for target in stmt.targets))
          assert exported == version, "Package and import versions differ"
          assert os.environ["GITHUB_REF_NAME"] == "chatsandbox-v" + version, "Tag/version mismatch"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={version}", file=output)
          PY
      - name: Check tag commit is on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main
      - name: Check PyPI version
        id: pypi
        env:
          PACKAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import urllib.error
          import urllib.request

          exists = "false"
          try:
              urllib.request.urlopen("https://pypi.org/pypi/ChatSandbox/" + os.environ["PACKAGE_VERSION"] + "/json", timeout=15)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          else:
              exists = "true"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"exists={exists}", file=output)
          PY
      - name: Stop when version is already on PyPI
        if: steps.pypi.outputs.exists == 'true'
        run: echo "ChatSandbox ${{ steps.meta.outputs.version }} is already on PyPI; skipping publish."
      - name: Build and verify only the independent Sandbox distribution
        if: steps.pypi.outputs.exists == 'false'
        run: |
          python -m pip install --upgrade build twine
          python -m build packages/chatsandbox --outdir sandbox-dist
          python -m twine check sandbox-dist/*
          python -m pip install sandbox-dist/*.whl
          python -m pip check
          chatsandbox --version
          chatsandbox --tree
          chatsandbox --tree-brief
      - name: Publish ChatSandbox to PyPI with OIDC
        if: steps.pypi.outputs.exists == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sandbox-dist/
