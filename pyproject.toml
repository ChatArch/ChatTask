[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ChatTask"
dynamic = ["version"]
description = "ChatTask: a ChatArch Python package."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["click>=8.0,<9.0", "chatstyle>=0.2.0,<0.3.0", "chatenv>=0.2.15,<0.3.0", "opensandbox==1.1.0", "docker>=7,<8", "httpx>=0.28,<0.29", "packaging>=24,<27", "tomli>=2,<3; python_version < '3.11'"]
authors = [{name = "ChatArch", email = "rex@chatarch.org"}]
keywords = ["chattask", "chatarch", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ChatArch/ChatTask"
Repository = "https://github.com/ChatArch/ChatTask"
Documentation = "https://arch.gh.wzhecnu.cn/ChatTask/"

[project.scripts]
chattask = "chattask.cli:main"

[project.optional-dependencies]
dev = ["build", "pytest", "twine"]
web = ["fastapi>=0.133,<0.143", "uvicorn>=0.41,<0.55", "ChatLogin[web]>=0.2.0,<0.3.0", "ChatPyPI>=0.2.14,<0.3.0", "ChatGH>=0.2.14,<0.3.0"]
docs = ["mkdocs>=1.6,<2.0", "mkdocs-material>=9.5,<9.7", "mkdocs-static-i18n>=1.2,<2.0", "mike>=2.0,<3.0"]

[project.entry-points."chatenv.configs"]
chattask = "chattask.config:ChatTaskConfig"

[tool.setuptools.dynamic]
version = {attr = "chattask.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
chattask = ["web_static/*.html", "web_static/*.css", "web_static/*.js"]
